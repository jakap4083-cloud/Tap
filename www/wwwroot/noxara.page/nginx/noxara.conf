# NOXARA aaPanel Nginx Server Block Security Configuration
# Configuration path on VPS: /www/server/nginx/conf/vhost/noxara.page.conf
# Document Root: /www/wwwroot/noxara.page

server {
    listen 80;
    listen 443 ssl http2;
    server_name noxara.page www.noxara.page;
    root /www/wwwroot/noxara.page;
    index index.php index.html index.htm;
    
    # SSL Setup aaPanel Config Examples (Will be replaced with real certificates by aaPanel Let's Encrypt)
    # ssl_certificate    /www/server/panel/vhost/cert/noxara.page/fullchain.pem;
    # ssl_certificate_key    /www/server/panel/vhost/cert/noxara.page/privkey.pem;
    # ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    
    # Gzip Compression for low latency on mobile devices
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml;
    gzip_vary on;

    # Secure Routing & Cache Headers
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # CRITICAL SECURITY RULE: Block folder path execution for code files inside uploads
    location ~* ^/uploads/.*\.php$ {
        deny all;
        return 403;
    }

    # CRITICAL SECURITY RULE: Block direct web access to sensitive operational subfolders
    location ~* ^/(config|includes|actions|database|cron|storage|nginx)/ {
        deny all;
        return 403;
    }

    # CRITICAL SECURITY RULE: Deny specific configuration, database exports, logs, and environments
    location ~* \.(sql|log|env|bak|backup|ini|conf|sh)$ {
        deny all;
        return 403;
    }

    # CRITICAL SECURITY RULE: Block hidden file patterns (e.g. .git, .env)
    location ~ /\. {
        deny all;
        return 403;
    }

    # FastCGI processing for PHP 8.2 aaPanel upstream
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-82.sock; # Default PHP-FPM 8.2 aaPanel socket path
        fastcgi_index index.php;
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Real IP configuration behind potential Cloudflare / Reverse Proxy layers
        fastcgi_param REMOTE_ADDR $http_x_real_ip;
    }

    # Static Assets Fast Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Disable system logs clutter
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # Main access and secure logging directories
    access_log /www/wwwlogs/noxara.page.log;
    error_log /www/wwwlogs/noxara.page.error.log error;
}
